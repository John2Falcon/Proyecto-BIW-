version: "3.8"

services:
  solr:
    image: solr:9
    container_name: solr-dev
    ports:
      - "8983:8983"
    volumes:
      - ./mi-core:/var/solr/data/mi_core

    restart: unless-stopped
    command: solr-precreate mi_core /var/solr/data/mi_core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mi_core_data:
